services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  mongo-init:
    image: mongo:7
    depends_on: { mongo: { condition: service_healthy } }
    restart: "no"
    command: ["mongosh", "--host", "mongo:27017", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  server:
    build: { context: ., target: server }
    env_file: server/.env
    environment: { MONGODB_URI: "mongodb://mongo:27017/fleetflow?replicaSet=rs0", REDIS_URL: "redis://redis:6379" }
    ports: ["4000:4000"]
    volumes: ["upload-data:/app/uploads"]
    depends_on: { mongo-init: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  worker:
    build: { context: ., target: server }
    command: ["node", "server/src/worker.js"]
    env_file: server/.env
    environment: { MONGODB_URI: "mongodb://mongo:27017/fleetflow?replicaSet=rs0", REDIS_URL: "redis://redis:6379" }
    depends_on: { server: { condition: service_healthy } }
  client:
    build: { context: ., target: client }
    ports: ["8080:80"]
    depends_on: { server: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes: { mongo-data: {}, redis-data: {}, upload-data: {} }
